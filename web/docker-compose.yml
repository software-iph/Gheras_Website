# GHERAS web + its PostgreSQL database. Settings come from .env.production (copy .env.production.example);
# link it as .env (`ln -s .env.production .env`) so every `docker compose` command reads it.
# Public traffic goes through Nginx Proxy Manager (https://gheras-ly.com -> gheras-web:3000 on the web_default network).
services:
  gheras-web:
    build: .
    container_name: gheras-web
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://gheras:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ln -s .env.production .env in this folder}@gheras-db:5432/gheras
    ports:
      # Only reachable from the server itself (e.g. curl http://127.0.0.1:3001/en); not exposed to the internet.
      - "127.0.0.1:3001:3000"
    volumes:
      - gheras-uploads:/app/image-uploads
      # Resized copies made by the image optimizer; kept so photos aren't resized again after each deploy.
      - gheras-image-cache:/app/.next/cache/images
    depends_on:
      gheras-db:
        condition: service_healthy

  gheras-db:
    image: postgres:17-alpine
    container_name: gheras-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gheras
      POSTGRES_USER: gheras
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ln -s .env.production .env in this folder}
    volumes:
      - gheras-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gheras -d gheras"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gheras-db:
  gheras-uploads:
  gheras-image-cache:
